<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
  <title>管理看板｜圖面資料申請</title>
  <meta name="description" content="開發部圖面資料申請的管理看板：申請趨勢、處理速度、外部用途、常用品號、駁回分析。">
  <meta property="og:title" content="管理看板｜圖面資料申請">
  <meta property="og:description" content="申請趨勢、處理速度、外部用途、常用品號、駁回分析。需以 LINE 登入，限核發主管、文管與系統管理員。">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="theme.css?v=16">
  <link rel="stylesheet" href="dashboard.css?v=16">
</head>
<body>
  <div class="viz-root">
    <header class="app-bar">
      <a class="brand" href="./" aria-label="回申請頁">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="currentColor"/>
          <g class="glyph" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.5 8h7.2l4.3 4.3V23a1 1 0 0 1-1 1H10.5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
            <path d="M17.5 8.2v4.3h4.3"/>
            <path d="M13 17h6M13 20.2h3.6"/>
          </g>
          <circle class="dot" cx="25.5" cy="6.5" r="3.6" stroke-width="1.6"/>
        </svg>
        <div class="brand-text">
          <h1 class="brand-name">管理看板</h1>
          <span class="brand-sub">圖面資料申請</span>
        </div>
      </a>
      <div class="app-bar-right">
        <span id="who" class="who"></span>
        <a href="./" class="pill-link">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3.5L5 8l4.5 4.5"/></svg>
          <span class="pill-text">申請頁</span>
        </a>
      </div>
    </header>

    <main class="dash-main">
      <div id="status" class="message info loading" role="status" aria-live="polite">登入中…</div>

      <div id="dash" hidden>
        <div class="dash-head">
          <div class="page-head">
            <span class="eyebrow">數據總覽</span>
            <h2>申請概況</h2>
            <p class="lead" id="range-text"></p>
          </div>
          <!-- 篩選（套用到下方所有圖表） -->
          <form id="filters" class="filters">
            <div class="seg" role="group" aria-label="期間">
              <button type="button" data-preset="month" aria-pressed="false">本月</button>
              <button type="button" data-preset="3m" aria-pressed="false">3 個月</button>
              <button type="button" data-preset="12m" aria-pressed="true">12 個月</button>
              <button type="button" data-preset="year" aria-pressed="false">今年</button>
              <button type="button" data-preset="all" aria-pressed="false">全部</button>
              <button type="button" data-preset="custom" aria-pressed="false">自訂</button>
            </div>
            <div class="filters-row">
              <div class="range">
                <input type="date" id="from" aria-label="起日">
                <span class="range-sep" aria-hidden="true">–</span>
                <input type="date" id="to" aria-label="迄日">
                <button type="submit" id="apply-btn" class="secondary small" hidden>套用</button>
              </div>
              <button type="button" id="export-btn" class="primary small">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v8M4.8 7.5L8 10.7l3.2-3.2M3 13.5h10"/></svg>
                匯出 Excel
              </button>
            </div>
          </form>
        </div>
        <div id="dash-message" class="message" role="status" aria-live="polite" hidden></div>

        <!-- 重點數字 -->
        <section class="tiles" id="tiles" aria-label="重點數字"></section>

        <div class="bento">
          <section class="panel span-8" aria-labelledby="t-monthly">
            <h2 id="t-monthly"><span class="idx">01</span>每月申請趨勢</h2>
            <p class="note">每月申請件數；滑過長條可看狀態分布。</p>
            <div id="monthly" class="colchart"></div>
            <details class="table-view"><summary>表格檢視</summary><div id="monthly-table"></div></details>
          </section>

          <section class="panel span-4" aria-labelledby="t-speed">
            <h2 id="t-speed"><span class="idx">02</span>處理速度</h2>
            <p class="note">各關平均處理時間（已完成的案件）；括號內為中位數。</p>
            <div id="speed" class="hbars stacked"></div>
            <h3>目前等待中</h3>
            <div id="pending"></div>
          </section>

          <section class="panel span-5" aria-labelledby="t-external">
            <h2 id="t-external"><span class="idx">03</span>申請用途與外部用途</h2>
            <p class="note">標示「外部」的用途會把資料提供給公司以外的對象。</p>
            <div id="purpose" class="hbars"></div>
            <h3>常見外發對象</h3>
            <p class="note">依「預計外發對象／備註說明」的內容統計。</p>
            <div id="external-targets" class="hbars"></div>
          </section>

          <section class="panel span-7" aria-labelledby="t-items">
            <h2 id="t-items"><span class="idx">04</span>最常被調閱的品號</h2>
            <p class="note">每行「品號/名稱」取斜線前的品號，大小寫視為相同。</p>
            <div id="top-items"></div>
          </section>

          <section class="panel span-4" aria-labelledby="t-reject">
            <h2 id="t-reject"><span class="idx">05</span>駁回分析</h2>
            <div id="reject-summary" class="mini-stats"></div>
            <h3>常見駁回原因</h3>
            <div id="reject-reasons" class="hbars stacked"></div>
          </section>

          <section class="panel span-4" aria-labelledby="t-dept">
            <h2 id="t-dept"><span class="idx">06</span>各部門申請件數</h2>
            <p class="note">依申請時選擇的所屬部門。</p>
            <div id="by-department" class="hbars stacked"></div>
          </section>

          <section class="panel span-4" aria-labelledby="t-type">
            <h2 id="t-type"><span class="idx">07</span>各資料別申請件數</h2>
            <p class="note">一張申請可勾選多種資料別。</p>
            <div id="by-data-type" class="hbars stacked"></div>
          </section>
        </div>
      </div>
    </main>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js?v=16"></script>
  <script src="auth.js?v=16"></script>
  <script src="common.js?v=16"></script>
  <script src="dashboard.js?v=16"></script>
</body>
</html>
